<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login & Signup | Upmark Curve (The Trip Hisab)</title>
  
  <meta name="title" content="Login | Upmark Curve (The Trip Hisab)">
  <meta name="description" content="Sign in via email and password on Upmark Curve (The Trip Hisab) to organize group travel expenses, track vacation budgets, and split hisab automatically.">
  <meta name="keywords" content="upmarkcurve login, the trip hisab login, travel expense account, trip budget tracker, otp login">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://upmarkcurve.com/login.html">

  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./src/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 100%); display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; }
    .auth-card { background: #fff; border-radius: 24px; padding: 36px 30px; width: 100%; max-width: 440px; box-shadow: 0 25px 60px rgba(0,0,0,0.35); }
    .auth-logo { text-align: center; margin-bottom: 22px; }
    .auth-logo-img { width: 68px; height: 68px; border-radius: 18px; margin: 0 auto 12px; display: block; box-shadow: 0 6px 18px rgba(0,102,255,0.28); }
    .auth-logo h1 { font-size: 1.45rem; font-weight: 800; color: #0F172A; letter-spacing: -0.3px; }
    .auth-logo .subtitle { font-size: 0.82rem; font-weight: 700; color: #0066FF; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }
    .auth-logo p { font-size: 0.82rem; color: #64748B; margin-top: 6px; }
    .tabs { display: flex; background: #F1F5F9; border-radius: 12px; padding: 4px; margin-bottom: 22px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 9px; font-size: 0.9rem; font-weight: 700; color: #64748B; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tab-btn.active { background: #fff; color: #0066FF; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E2E8F0; border-radius: 11px;
      font-size: 0.95rem; color: #0F172A; background: #F8FAFC; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #0066FF; background: #fff; }
    .otp-input { font-size: 1.6rem !important; letter-spacing: 8px; font-weight: 800; text-align: center; }
    .btn-primary { width: 100%; padding: 13px; background: #0066FF; color: #fff; border: none; border-radius: 11px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
    .btn-primary:hover { background: #0052CC; }
    .btn-primary:disabled { background: #93C5FD; cursor: not-allowed; }
    .btn-secondary { width: 100%; padding: 11px; background: transparent; color: #0066FF; border: 1.5px solid #0066FF; border-radius: 11px; font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn-secondary:hover { background: #EFF6FF; }
    .alert { padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; line-height: 1.4; }
    .alert-error { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
    .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
    .alert-info { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .link-action { font-size: 0.82rem; color: #0066FF; cursor: pointer; text-decoration: none; font-weight: 600; }
    .link-action:hover { text-decoration: underline; }
    .divider { text-align: center; font-size: 0.78rem; color: #94A3B8; margin: 18px 0; position: relative; }
    .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #E2E8F0; }
    .divider span { background: #fff; padding: 0 10px; position: relative; }
    .domain-badge { text-align: center; margin-top: 22px; font-size: 0.76rem; color: #94A3B8; }
    .domain-badge strong { color: #0066FF; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <img src="./logo.svg" alt="Upmark Curve Logo" class="auth-logo-img">
      <h1>Upmark Curve</h1>
      <div class="subtitle">The Trip Hisab</div>
      <p>Minimal Group Budget & Expense Tracker</p>
    </div>

    <!-- Alert box -->
    <div id="auth-alert" class="alert" style="display:none;"></div>

    <!-- Two Main Tabs: Log In / Sign Up -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="login" id="tab-login-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Log In</span>
      </button>
      <button class="tab-btn" data-tab="signup" id="tab-signup-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <span>Create Account</span>
      </button>
    </div>

    <!-- 1. LOGIN PANEL (Email + Password) -->
    <div class="tab-panel active" id="panel-login">
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label for="login-password" style="margin-bottom:0;">Password</label>
            <span class="link-action" id="forgot-link">Forgot password?</span>
          </div>
          <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="btn-login">Log In</button>
      </form>

      <div class="divider"><span>or sign in without password</span></div>
      <button type="button" class="btn-secondary" id="btn-toggle-otp-login">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:4px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Send 6-Digit Login Code to Email
      </button>
    </div>

    <!-- 2. CREATE ACCOUNT PANEL (Exact 3 Options: Name, Email, Password) -->
    <div class="tab-panel" id="panel-signup">
      <form id="form-signup">
        <div class="form-group">
          <label for="signup-name">1. Your Name</label>
          <input type="text" id="signup-name" placeholder="e.g. Debabrata, Rohan, Priya..." required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="signup-email">2. Email Address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signup-password">3. Password (min 6 characters)</label>
          <input type="password" id="signup-password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="btn-signup">Create Account & Continue</button>
      </form>
    </div>

    <!-- 3. OTP VERIFICATION BOX (Shows when code is sent for Signup or Login) -->
    <div id="panel-verify-code" style="display: none;">
      <div style="text-align:center; margin-bottom:14px;">
        <div style="font-weight:700; color:#0F172A; font-size:1.05rem;">Enter 6-Digit Code</div>
        <div style="font-size:0.82rem; color:#64748B; margin-top:4px;">We sent a verification code to <b id="otp-target-email">your email</b></div>
      </div>
      <form id="form-verify-otp">
        <div class="form-group">
          <input type="text" id="otp-code" class="otp-input" placeholder="------" maxlength="10" inputmode="numeric" pattern="[0-9]*" required autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn-primary" id="btn-verify-otp">Verify Code & Enter</button>
        <div style="display:flex; justify-content:space-between; margin-top:12px;">
          <span class="link-action" id="btn-resend-otp">Resend Code</span>
          <span class="link-action" id="btn-cancel-otp">Back to Log In</span>
        </div>
      </form>
    </div>

    <div class="domain-badge">Official <strong>upmarkcurve.com</strong> · Free Group Travel Tracker</div>
  </div>

  <script type="module">
    import { signIn, signUp, sendOtp, verifyOtp, getUser, resetPassword, onAuthChange } from './src/supabase.js';

    // Auto-login if user clicked link or session active
    onAuthChange((user) => {
      if (user) {
        window.location.href = './trips.html';
      }
    });

    const user = await getUser();
    if (user) { window.location.href = './trips.html'; }

    let currentEmail = sessionStorage.getItem('upmark_auth_email') || '';

    // Switch Tabs
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-verify-code').style.display = 'none';
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        hideAlert();
      });
    });

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('auth-alert');
      el.className = `alert alert-${type}`;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('auth-alert').style.display = 'none';
    }

    function setLoading(btnId, loading, text) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.disabled = loading;
      btn.innerHTML = loading ? `<span class="spinner"></span>Please wait...` : text;
    }

    function showVerificationUI(email) {
      currentEmail = email;
      sessionStorage.setItem('upmark_auth_email', email);
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-verify-code').style.display = 'block';
      document.getElementById('otp-target-email').textContent = email;
      document.getElementById('otp-code').value = '';
      setTimeout(() => document.getElementById('otp-code').focus(), 80);
    }

    // ─── 1. PASSWORD LOGIN ───────────────────────────────────────────────────
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      setLoading('btn-login', true, 'Log In');
      try {
        await signIn(email, password);
        window.location.href = './trips.html';
      } catch (err) {
        // If email not confirmed, offer OTP verification
        if (err.message && err.message.toLowerCase().includes('email not confirmed')) {
          showAlert('Please confirm your email code first. Sending code now...', 'info');
          await sendOtp(email);
          showVerificationUI(email);
        } else {
          showAlert(err.message || 'Incorrect email or password. Please try again.');
        }
      } finally {
        setLoading('btn-login', false, 'Log In');
      }
    });

    // ─── 2. CREATE ACCOUNT (3 Options: Name, Email, Password) ───────────────
    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim().toLowerCase();
      const password = document.getElementById('signup-password').value;

      if (!name) { showAlert('Please enter your name.'); return; }
      if (!email) { showAlert('Please enter your email.'); return; }
      if (!password || password.length < 6) { showAlert('Password must be at least 6 characters.'); return; }

      setLoading('btn-signup', true, 'Create Account');
      try {
        const res = await signUp(email, password, name);
        // If Supabase immediately returns a session (email confirmation off)
        if (res?.session) {
          showAlert('Account created! Logging you in...', 'success');
          window.location.href = './trips.html';
          return;
        }
        // Email verification code sent
        showAlert(`Verification code sent to ${email}! Enter the 6-digit code below.`, 'info');
        showVerificationUI(email);
      } catch (err) {
        showAlert(err.message || 'Failed to create account. Please check your information.');
      } finally {
        setLoading('btn-signup', false, 'Create Account & Continue');
      }
    });

    // ─── 3. OTP VERIFY FORM ──────────────────────────────────────────────────
    document.getElementById('form-verify-otp').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      const email = currentEmail || sessionStorage.getItem('upmark_auth_email');
      const code = document.getElementById('otp-code').value.trim().replace(/\s+/g, '');
      if (!code || code.length < 4) {
        showAlert('Please enter the 6-digit code sent to your email.');
        return;
      }
      setLoading('btn-verify-otp', true, 'Verifying...');
      try {
        await verifyOtp(email, code);
        sessionStorage.removeItem('upmark_auth_email');
        showAlert('Code verified! Entering your trips...', 'success');
        window.location.href = './trips.html';
      } catch (err) {
        showAlert(err.message || 'Invalid or expired code. Please check your inbox or resend code.');
      } finally {
        setLoading('btn-verify-otp', false, 'Verify Code & Enter');
      }
    });

    // Resend OTP
    document.getElementById('btn-resend-otp').addEventListener('click', async () => {
      hideAlert();
      const email = currentEmail || sessionStorage.getItem('upmark_auth_email');
      if (!email) { showAlert('Email is missing.'); return; }
      try {
        await sendOtp(email);
        showAlert(`A fresh code has been sent to ${email}!`, 'success');
      } catch (err) {
        showAlert(err.message || 'Could not resend code.');
      }
    });

    // Cancel OTP back to Login
    document.getElementById('btn-cancel-otp').addEventListener('click', () => {
      document.getElementById('tab-login-btn').click();
    });

    // Quick OTP Login option from Login tab
    document.getElementById('btn-toggle-otp-login').addEventListener('click', async () => {
      hideAlert();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      if (!email) {
        showAlert('Please enter your email above first, then click Send Code.', 'info');
        document.getElementById('login-email').focus();
        return;
      }
      setLoading('btn-toggle-otp-login', true, 'Sending Code...');
      try {
        await sendOtp(email);
        showAlert(`Login code sent to ${email}! Check your inbox.`, 'info');
        showVerificationUI(email);
      } catch (err) {
        showAlert(err.message || 'Failed to send login code.');
      } finally {
        setLoading('btn-toggle-otp-login', false, 'Send 6-Digit Login Code to Email');
      }
    });

    // Forgot Password
    document.getElementById('forgot-link')?.addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      if (!email) { showAlert('Enter your email in the box above first, then click Forgot Password.', 'info'); return; }
      try {
        await resetPassword(email);
        showAlert('Password reset link sent to your email! Check your inbox.', 'success');
      } catch (err) {
        showAlert(err.message || 'Failed to send reset email.');
      }
    });
  </script>
</body>
</html>
