<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="curveGrad" x1="10" y1="110" x2="110" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="50" y1="50" x2="105" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0066FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background with subtle border -->
  <rect width="120" height="120" rx="28" fill="#0F172A" />
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" stroke="#1E293B" stroke-width="3" />
  
  <!-- Upward Trajectory Grid / Dotted Path -->
  <circle cx="28" cy="92" r="3" fill="#38BDF8" fill-opacity="0.6" />
  <circle cx="44" cy="78" r="3.5" fill="#38BDF8" fill-opacity="0.75" />
  <circle cx="62" cy="60" r="4" fill="#38BDF8" fill-opacity="0.9" />

  <!-- Upmark Curve swoosh -->
  <path d="M 22 98 C 45 92 68 76 86 46 C 94 32 100 20 102 18" 
        stroke="url(#curveGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Ascending Travel Supersonic Plane -->
  <g transform="translate(68, 16) rotate(12)">
    <!-- Plane Body -->
    <path d="M 32 6 L 8 18 L 13 23 L 20 20 L 19 28 L 24 25 L 29 32 L 32 6 Z" 
          fill="url(#planeGrad)" 
          stroke="#0F172A" 
          stroke-width="1.2" 
          stroke-linejoin="round"
          filter="url(#glow)"/>
  </g>
</svg>
